<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="1;url=index.html#menu-catalog">
    <title>منيو كريم السوري</title>
</head>
<body>
    <p>يتم فتح المنيو… <a href="index.html#menu-catalog">اضغط هنا إذا لم تنتقل تلقائيًا</a></p>
    <script>
        const categoryIds = ['shawarma', 'western_sandwich', 'crepe', 'fatta', 'arabic', 'western_meals', 'extras'];
        const category = new URLSearchParams(location.search).get('category');
        const destination = new URL('index.html', location.href);
        if (categoryIds.includes(category)) destination.searchParams.set('category', category);
        destination.hash = 'menu-catalog';
        location.replace(destination);
    </script>
</body>
</html>
